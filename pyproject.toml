[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "mtgtable"
dynamic = ["version"]
description = "A digital tabletop where AI plays paper Magic: The Gathering (a table engine, not a rules engine)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE.md"]
authors = [{ name = "Tetsuya Iwaki" }]
requires-python = ">=3.10"
dependencies = []  # 標準ライブラリだけで動く

[project.scripts]
mtgtable = "mtgtable.cli:main"

[tool.hatch.version]
path = "mtgtable/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["mtgtable"]

# 読むだけのもの（同梱のデッキ・審判のリファレンス）の正本はリポジトリの今の場所。配布物ではパッケージの中の
# assets/ に写す（mtgtable/paths.py。design/app_plan.md 段階 2）
[tool.hatch.build.targets.wheel.force-include]
"decklists" = "mtgtable/assets/decklists"
".claude/skills/mtg-playtest/references" = "mtgtable/assets/references"

# sdist は wheel を作り直せるものとテスト（先頭の / でリポジトリ直下に限る。無いと tests/ の下の同じ名前なども入る）。カードのキャッシュ・キー・対局は .gitignore で入らない
[tool.hatch.build.targets.sdist]
include = [
  "/mtgtable",
  "/decklists",
  "/.claude/skills/mtg-playtest/references",
  "/tests",
  "/README.md",
  "/LICENSE",
  "/NOTICE.md",
]
